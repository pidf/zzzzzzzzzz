<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>cheatgram</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <main>

        <!-- FOCUS MODE -->

        <header>
            <h1>cheatgram</h1>
            <p id="word-count">loading wordlist...</p>
        </header>

        <section class="focus">
            <input
                id="search"
                type="text"
                placeholder="search..."
                autocomplete="off"
                autofocus
            >

            <div id="results"></div>
        </section>


        <!-- SETTINGS -->

        <section class="settings">

            <h2>settings</h2>

            <label>
                results to display
                <input
                    id="max-results"
                    type="number"
                    min="1"
                    value="1"
                >
            </label>

            <label>
                <input
                    id="highlight-substring"
                    type="checkbox"
                    checked
                >

                highlight substring
            </label>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>
    <section class="used">
    <h2>used</h2>

    <button id="take-back-all">
        put all back
    </button>

    <div id="used-words"></div>
</body>
</html>
