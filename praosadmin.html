<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>cheatgram</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <main>
        <header>
            <h1>cheatgram</h1>
            <p id="word-count">loading wordlist...</p>
        </header>

        <section class="search">
            <input
                id="search"
                type="text"
                placeholder="search for a substring..."
                autocomplete="off"
                autofocus
            >

            <button id="search-button">search</button>

            <div id="results"></div>
        </section>

        <section class="tools">
            <h2>tools</h2>

            <div class="buttons">
                <button>random word</button>
                <button>wordlist</button>
                <button>categories</button>
                <button>history</button>
                <button>statistics</button>
                <button>settings</button>
            </div>
        </section>

        <section class="categories">
            <h2>categories</h2>

            <div class="buttons">
                <button>all words</button>
                <button>short words</button>
                <button>long words</button>
                <button>common words</button>
                <button>rare words</button>
                <button>custom</button>
            </div>
        </section>

        <section class="extra">
            <h2>other shit</h2>

            <div class="buttons">
                <button>word length</button>
                <button>starts with</button>
                <button>ends with</button>
                <button>exact match</button>
                <button>export</button>
                <button>import</button>
            </div>
        </section>

        <footer>
            <a href="/praosadmin.html">praosadmin</a>
        </footer>
    </main>

    <script type="module" src="js/app.js"></script>

</body>
</html>
